<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <title>Login</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <section class="login">
   <!-- Single “card” that centres itself via CSS -->
  <div class="card auth login">
    <h1>Login</h1>

    <!-- No action= or method= needed – we AJAX-submit manually -->
    <form id="loginForm" autocomplete="off">
       <!-- name= attributes match the JSON keys expected by api.php -->
      <input name="username" placeholder="Username" required>
      <input name="password" type="password" placeholder="Password" required>
      <button type="submit">Login</button>
    </form>
     <!-- Simple link to the register page -->
    <p>or <a href="register.html">create an account</a></p>
  </div>
  </section>

<script>
  /* ----------  Client-side login handler  ---------- */
document.getElementById('loginForm').onsubmit = async e => {
  e.preventDefault();           // stay on this page
  const body = Object.fromEntries(new FormData(e.target));  // {username, password}

   // Fire & forget – api.php does the real validation
  const res  = await fetch('api.php?action=login',{
                          method : 'POST',
                          headers: {'Content-Type':'application/json'},
                          body   : JSON.stringify(body)
                      }).then(r=>r.json());

  // PHP returns either {success:true, username:...} or {error:'...'}
  if (res.error) return alert(res.error);     // wrong password / unknown user
  location.href = 'tasks.html';               // 302-style redirect on success
};
</script>
</body>
</html>
