<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <title>Register</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <section class="login">
  <div class="card auth login">

     <!-- Same shape as login form – only the button label changes -->
    <h1>Register</h1>
    <form id="regForm" autocomplete="off">
      <input name="username" placeholder="Username" required>
      <input name="password" type="password" placeholder="Password" required>
      <button type="submit">Create account</button>
    </form>
    <p>or <a href="index.html">back to login</a></p>
  </div>
  </section>

<script>
/* ----------  Registration handler  ---------- */
document.getElementById('regForm').onsubmit = async e => {
  e.preventDefault();
  const body = Object.fromEntries(new FormData(e.target));
  const res  = await fetch('api.php?action=register',{
                          method : 'POST',
                          headers: {'Content-Type':'application/json'},
                          body   : JSON.stringify(body)
                      }).then(r=>r.json());
  if (res.error) return alert(res.error);        // username too short / already taken
  alert('Account created – please log in');      // gentle UX nudge
  location.href = 'index.html';                  // go login with the new creds
};
</script>
</body>
</html>
