<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <title>My Tasks</title>
  <link rel="stylesheet" href="styles.css?v=1.1">
</head>
<body>
  <!-- Fixed header bar -->
  <header>
    <span id="greet"></span>          <!-- filled by whoami call -->
    <span class="spacer"></span>
    <button id="btnOut">Logout</button>
  </header>

  <!-- Main content wrapper -->
  <main>
    <!-- Add task container -->
    <div class="card add-card">
      <h1>Add To-Do</h1>
      <div class="add-section">
        <input id="newTask" placeholder="What needs to be done?">
        <textarea id="taskDescription" placeholder="Add a description (optional)"></textarea>
        <select id="taskPriority">
          <option value="low">Low</option>
          <option value="medium" selected>Medium</option>
          <option value="high">High</option>
        </select>
        <button onclick="addTask()">Add</button>
      </div>
    </div>

    <!-- Task list container -->
    <div class="card list-card">
      <h1>My To-Do List</h1>
      <!-- Empty on first paint – populated by loadTasks() -->
      <ul id="taskList"></ul>
    </div>
  </main>

<script>
/* =========================================================
  Plain-JS CRUD
   ========================================================= */

const api = function(action, payload) {
    console.groupCollapsed('API call: ' + action);
    console.log('Sent ->', payload);

    return fetch('api.php?action=' + action, {
        method : 'POST',
        headers: {'Content-Type': 'application/json'},
        body   : JSON.stringify(payload)
    })
    .then(function(response){ return response.json(); })
    .then(function(data){
        console.log('Received <-', data);
        console.groupEnd();
        return data;
    });
};

/* ----------  page ready  ---------- */
document.addEventListener('DOMContentLoaded', function(){
    checkLogin();
});

function checkLogin(){
    api('whoami').then(function(user){
        if (user.guest){                // not authenticated
            location.href = 'index.html';
            return;
        }
        document.getElementById('greet').textContent = 'Hello, ' + user.username;
        loadTaskList();                 // pull tasks
    });
}

/* ----------  logout  ---------- */
document.getElementById('btnOut').onclick = function(){
    api('logout').then(function(){
        location.href = 'index.html';
    });
};

/* ----------  READ  ---------- */
function loadTaskList(){
    api('read').then(function(taskArray){
        var taskList = document.getElementById('taskList');
        taskList.innerHTML = ''; // Clear existing list
        for (var idx = 0; idx < taskArray.length; idx++) {
            var taskObj = taskArray[idx];
            var taskId = taskObj.id;
            var taskText = escapeHtml(taskObj.task);
            var taskDescription = taskObj.description ? escapeHtml(taskObj.description) : '';
            var taskPriority = taskObj.priority ? escapeHtml(taskObj.priority) : 'medium';

            // Create li element
            var li = document.createElement('li');
            li.id = 'row-' + taskId;
            if (taskObj.completed) li.classList.add('completed');

            // Create task-card div
            var taskCard = document.createElement('div');
            taskCard.classList.add('task-card');

            // Create task-header div
            var taskHeader = document.createElement('div');
            taskHeader.classList.add('task-header');

            // Create checkbox
            var checkbox = document.createElement('input');
            checkbox.type = 'checkbox';
            if (taskObj.completed) checkbox.checked = true;
            checkbox.setAttribute('onchange', 'toggleTaskCompletion(' + taskId + ', this.checked)');

            // Create task-text span
            var taskTextSpan = document.createElement('span');
            taskTextSpan.classList.add('task-text');
            taskTextSpan.textContent = taskText;

            // Create delete span
            var deleteSpan = document.createElement('span');
            deleteSpan.classList.add('delete');
            deleteSpan.setAttribute('onclick', 'deleteTaskById(' + taskId + ')');
            deleteSpan.textContent = '✗';

            // Append header elements
            taskHeader.appendChild(checkbox);
            taskHeader.appendChild(taskTextSpan);
            taskHeader.appendChild(deleteSpan);

            // Create task-description textarea if description exists
            if (taskDescription) {
                var descriptionTextarea = document.createElement('textarea');
                descriptionTextarea.classList.add('task-description');
                descriptionTextarea.readOnly = true;
                descriptionTextarea.textContent = taskDescription;
            }

            // Create task-priority wrapper and p
            var priorityWrapper = document.createElement('div');
            priorityWrapper.classList.add('task-priority-wrapper');
            var priorityP = document.createElement('p');
            priorityP.classList.add('task-priority');
            priorityP.textContent = taskPriority.charAt(0).toUpperCase() + taskPriority.slice(1);

            // Append priority elements
            priorityWrapper.appendChild(priorityP);

            // Append all to task-card
            taskCard.appendChild(taskHeader);
            if (descriptionTextarea) taskCard.appendChild(descriptionTextarea);
            taskCard.appendChild(priorityWrapper);

            // Append to li
            li.appendChild(taskCard);

            // Append li to taskList
            taskList.appendChild(li);
        }
        console.log('Task list DOM updated:', taskList.innerHTML); // Debug log
    });
}

/* ----------  CREATE  ---------- */
function addTask(){
    var inputBox = document.getElementById('newTask');
    var descriptionBox = document.getElementById('taskDescription');
    var priorityBox = document.getElementById('taskPriority');
    var taskText = inputBox.value.trim();
    var taskDescription = descriptionBox.value.trim();
    var taskPriority = priorityBox.value;

    if (taskText === ''){
        alert('Task name cannot be empty!');
        return;
    }

    api('create', {
        task: taskText,
        description: taskDescription,
        priority: taskPriority
    }).then(function(){
        inputBox.value = '';
        descriptionBox.value = '';
        priorityBox.value = 'medium'; // Reset to default
        loadTaskList();          // refresh
    });
}

/* ----------  UPDATE (toggle)  ---------- */
function toggleTaskCompletion(taskId, isNowChecked){
    var completedFlag = isNowChecked ? 1 : 0;
    api('update', {id: taskId, completed: completedFlag}).then(loadTaskList);
}

/* ----------  DELETE  ---------- */
function deleteTaskById(taskId){
    if (!confirm('Delete this task?')) return;
    api('delete', {id: taskId}).then(loadTaskList);
}

/* ----------  basic HTML escape  ---------- */
function escapeHtml(rawStr){
    var tempDiv = document.createElement('div');
    tempDiv.textContent = rawStr;
    return tempDiv.innerHTML;
}
</script>
</body>
</html>
