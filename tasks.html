<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <title>My Tasks</title>
  <link rel="stylesheet" href="styles.css?v=1.1">
</head>
<body>
  <!-- Fixed header bar -->
  <header>
    <span id="greet"></span>          <!-- filled by whoami call -->
    <span class="spacer"></span>
    <button id="btnOut">Logout</button>
  </header>

  <!-- Main content wrapper -->
  <main>
    <!-- Add task container -->
    <div class="card add-card">
      <h1>Add To-Do</h1>
      <div class="add-section">
        <input id="newTask" placeholder="What needs to be done?">
        <textarea id="taskDescription" placeholder="Add a description (optional)"></textarea>
        <select id="taskPriority">
          <option value="low">Low</option>
          <option value="medium" selected>Medium</option>
          <option value="high">High</option>
        </select>
        <button onclick="addTask()">Add</button>
      </div>
    </div>

    <!-- Task list container -->
    <div class="card list-card">
      <h1>My To-Do List</h1>
      <!-- Empty on first paint – populated by loadTasks() -->
      <ul id="taskList"></ul>
    </div>
  </main>

<script>
/* =========================================================
  Plain-JS CRUD - Päivitetty muokkaustoiminnoilla
   ========================================================= */

const api = function(action, payload) {
    console.groupCollapsed('API call: ' + action);
    console.log('Sent ->', payload);

    return fetch('api.php?action=' + action, {
        method : 'POST',
        headers: {'Content-Type': 'application/json'},
        body   : JSON.stringify(payload)
    })
    .then(function(response){ return response.json(); })
    .then(function(data){
        console.log('Received <-', data);
        console.groupEnd();
        return data;
    });
};

/* ----------  Sivun alustus  ---------- */
document.addEventListener('DOMContentLoaded', function(){
    checkLogin();
});

function checkLogin(){
    api('whoami').then(function(user){
        if (user.guest){                // Ei kirjautunut
            location.href = 'index.html';
            return;
        }
        document.getElementById('greet').textContent = 'Hello, ' + user.username;
        loadTaskList();                 // Haetaan tehtävät
    });
}

/* ----------  Kirjaudu ulos  ---------- */
document.getElementById('btnOut').onclick = function(){
    api('logout').then(function(){
        location.href = 'index.html';
    });
};

/* ----------  READ (Haku ja listan rakennus)  ---------- */
function loadTaskList(){
    api('read').then(function(taskArray){
        var taskList = document.getElementById('taskList');
        taskList.innerHTML = ''; // Tyhjennetään lista
        
        for (var idx = 0; idx < taskArray.length; idx++) {
            var taskObj = taskArray[idx];
            var taskId = taskObj.id;
            var taskText = escapeHtml(taskObj.task);
            var taskDescription = taskObj.description ? escapeHtml(taskObj.description) : '';
            var taskPriority = taskObj.priority ? escapeHtml(taskObj.priority) : 'medium';

            // Luodaan li-elementti
            var li = document.createElement('li');
            li.id = 'row-' + taskId;
            if (taskObj.completed) li.classList.add('completed');

            // Luodaan task-card div
            var taskCard = document.createElement('div');
            taskCard.classList.add('task-card');

            // --- HEADER (Checkbox, Nimi/Input, Edit, Delete) ---
            var taskHeader = document.createElement('div');
            taskHeader.classList.add('task-header');

            var checkbox = document.createElement('input');
            checkbox.type = 'checkbox';
            if (taskObj.completed) checkbox.checked = true;
            checkbox.setAttribute('onchange', 'toggleTaskCompletion(' + taskId + ', this.checked)');

            // Tehtävän nimi (normaalitila)
            var taskTextSpan = document.createElement('span');
            taskTextSpan.classList.add('task-text');
            taskTextSpan.textContent = taskText;

            // Muokkauspainike (Kynä)
            var editBtn = document.createElement('button');
            editBtn.textContent = '✎';
            editBtn.classList.add('edit-btn');
            editBtn.onclick = (function(id) {
                return function() { toggleEditMode(id); };
            })(taskId);

            var deleteSpan = document.createElement('span');
            deleteSpan.classList.add('delete');
            deleteSpan.setAttribute('onclick', 'deleteTaskById(' + taskId + ')');
            deleteSpan.textContent = '✗';

            taskHeader.appendChild(checkbox);
            taskHeader.appendChild(taskTextSpan);
            taskHeader.appendChild(editBtn);
            taskHeader.appendChild(deleteSpan);

            // --- MUOKKAUSKENTÄT (Piilossa oletuksena) ---
            
            // Nimen muokkaus-input
            var nameInput = document.createElement('input');
            nameInput.type = 'text';
            nameInput.value = taskObj.task;
            nameInput.classList.add('edit-name');
            nameInput.style.display = 'none';

            // Kuvaus (textarea)
            var descriptionTextarea = document.createElement('textarea');
            descriptionTextarea.classList.add('task-description');
            descriptionTextarea.readOnly = true; 
            descriptionTextarea.textContent = taskObj.description || '';

            // Prioriteetin muokkaus (select)
            var prioritySelect = document.createElement('select');
            prioritySelect.classList.add('edit-priority');
            prioritySelect.style.display = 'none';
            ['low', 'medium', 'high'].forEach(function(p) {
                var opt = document.createElement('option');
                opt.value = p;
                opt.textContent = p.charAt(0).toUpperCase() + p.slice(1);
                if(p === taskObj.priority) opt.selected = true;
                prioritySelect.appendChild(opt);
            });

            // Prioriteetin näyttö (normaalitila)
            var priorityWrapper = document.createElement('div');
            priorityWrapper.classList.add('task-priority-wrapper');
            var priorityP = document.createElement('p');
            priorityP.classList.add('task-priority');
            priorityP.textContent = taskPriority.charAt(0).toUpperCase() + taskPriority.slice(1);
            priorityWrapper.appendChild(priorityP);

            // Tallenna-painike
            var saveBtn = document.createElement('button');
            saveBtn.textContent = 'Save';
            saveBtn.classList.add('save-btn');
            saveBtn.style.display = 'none';
            saveBtn.onclick = (function(id) {
                return function() { saveTaskEdits(id); };
            })(taskId);

            // Kootaan kortti
            taskCard.appendChild(taskHeader);
            taskCard.appendChild(nameInput);
            taskCard.appendChild(descriptionTextarea);
            taskCard.appendChild(prioritySelect);
            taskCard.appendChild(priorityWrapper);
            taskCard.appendChild(saveBtn);

            li.appendChild(taskCard);
            taskList.appendChild(li);
        }
    });
}

/* ----------  MUOKKAUSTILAN VAIHTO  ---------- */
function toggleEditMode(taskId) {
    var row = document.getElementById('row-' + taskId);
    var desc = row.querySelector('.task-description');
    var nameInput = row.querySelector('.edit-name');
    var nameSpan = row.querySelector('.task-text');
    var prioSelect = row.querySelector('.edit-priority');
    var prioWrapper = row.querySelector('.task-priority-wrapper');
    var saveBtn = row.querySelector('.save-btn');
    var editBtn = row.querySelector('.edit-btn');

    var isEditing = desc.readOnly; // Jos readOnly on true, ollaan siirtymässä muokkaukseen
    
    desc.readOnly = !isEditing;
    desc.classList.toggle('editing');
    
    nameInput.style.display = isEditing ? 'block' : 'none';
    nameSpan.style.display = isEditing ? 'none' : 'block';
    prioSelect.style.display = isEditing ? 'block' : 'none';
    prioWrapper.style.display = isEditing ? 'none' : 'block';
    saveBtn.style.display = isEditing ? 'inline-block' : 'none';
    
    editBtn.textContent = isEditing ? '✕' : '✎'; // Peruuta-merkki tai kynä
}

/* ----------  TALLENNUS  ---------- */
function saveTaskEdits(taskId) {
    var row = document.getElementById('row-' + taskId);
    var newTaskName = row.querySelector('.edit-name').value;
    var newDesc = row.querySelector('.task-description').value;
    var newPrio = row.querySelector('.edit-priority').value;

    api('update', {
        id: taskId,
        task: newTaskName,
        description: newDesc,
        priority: newPrio
    }).then(function(res) {
        if (res.error) {
            alert(res.error);
        } else {
            loadTaskList(); // Päivitetään lista onnistumisen jälkeen
        }
    });
}

/* ----------  CREATE  ---------- */
function addTask(){
    var inputBox = document.getElementById('newTask');
    var descriptionBox = document.getElementById('taskDescription');
    var priorityBox = document.getElementById('taskPriority');
    var taskText = inputBox.value.trim();
    var taskDescription = descriptionBox.value.trim();
    var taskPriority = priorityBox.value;

    if (taskText === ''){
        alert('Task name cannot be empty!');
        return;
    }

    api('create', {
        task: taskText,
        description: taskDescription,
        priority: taskPriority
    }).then(function(){
        inputBox.value = '';
        descriptionBox.value = '';
        priorityBox.value = 'medium';
        loadTaskList();
    });
}

/* ----------  UPDATE (Status)  ---------- */
function toggleTaskCompletion(taskId, isNowChecked){
    var completedFlag = isNowChecked ? 1 : 0;
    api('update', {id: taskId, completed: completedFlag}).then(loadTaskList);
}

/* ----------  DELETE  ---------- */
function deleteTaskById(taskId){
    if (!confirm('Delete this task?')) return;
    api('delete', {id: taskId}).then(loadTaskList);
}

/* ----------  HTML Escape  ---------- */
function escapeHtml(rawStr){
    var tempDiv = document.createElement('div');
    tempDiv.textContent = rawStr;
    return tempDiv.innerHTML;
}
</script>
</body>
</html>
